name: Atendimento

services:
  Atendimento:
    build: .
    container_name: kelmor-api
    ports:
      - "3001:3000"
    env_file:
      - .env
    depends_on:
      - kelmor-postgres
      - kelmor-redis
    networks:
      - kelmor-network
    restart: unless-stopped
    volumes:
      - kelmor_uploads:/app/uploads

  kelmor-postgres:
    image: postgres:16-alpine
    container_name: kelmor-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - kelmor_postgres_data:/var/lib/postgresql/data
    networks:
      - kelmor-network

  kelmor-redis:
    image: redis:7-alpine
    container_name: kelmor-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - kelmor_redis_data:/data
    networks:
      - kelmor-network

volumes:
  kelmor_postgres_data:
  kelmor_redis_data:
  kelmor_uploads:

networks:
  kelmor-network:
    driver: bridge
