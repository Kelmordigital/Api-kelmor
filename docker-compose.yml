name: atendimento

services:
  atendimento:
    build: .
    container_name: kelmor-api
    ports:
      - "127.0.0.1:3003:3000"
    env_file:
      - .env
    depends_on:
      - kelmor-postgres
      - kelmor-redis
      - kelmor-rabbitmq
    networks:
      - kelmor-network
    restart: unless-stopped
    volumes:
      - kelmor_uploads:/app/uploads

  kelmor-postgres:
    image: postgres:16-alpine
    container_name: kelmor-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - kelmor_postgres_data:/var/lib/postgresql/data
    networks:
      - kelmor-network

  kelmor-redis:
    image: redis:7-alpine
    container_name: kelmor-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 60 1
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - kelmor_redis_data:/data
    networks:
      - kelmor-network

  kelmor-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kelmor-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-kelmor}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-kelmor123}
    ports:
      # Somente local: amqp (5672) e painel de gestão (15672)
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - kelmor_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - kelmor-network

  kelmor-alloy:
    image: grafana/alloy:v1.5.1
    container_name: kelmor-alloy
    restart: always
    mem_limit: 200m
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data", "--disable-reporting"]
    env_file:
      - .env
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/sys:ro
      - /:/rootfs:ro
      - /var/lib/docker:/var/lib/docker:ro
      - kelmor_alloy_data:/var/lib/alloy/data
    networks:
      - kelmor-network

volumes:
  kelmor_postgres_data:
  kelmor_redis_data:
  kelmor_rabbitmq_data:
  kelmor_uploads:
  kelmor_alloy_data:

networks:
  kelmor-network:
    driver: bridge
