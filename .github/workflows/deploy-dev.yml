name: CI/CD API-04 (dev)

on:
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kelmor
          POSTGRES_PASSWORD: kelmor123
          POSTGRES_DB: efacil_db_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://kelmor:kelmor123@localhost:5433/efacil_db_test
      TEST_DATABASE_URL: postgresql://kelmor:kelmor123@localhost:5433/efacil_db_test
      REDIS_URL: redis://localhost:6379
      BAYS_URL: http://bays-nao-existe-no-ci.invalid
      JWT_SECRET: ci_dummy_jwt_secret_com_mais_de_32_caracteres
      REFRESH_SECRET: ci_dummy_refresh_secret_com_mais_de_32_chars
      ADMIN_SECRET: ci_dummy_admin_secret_16
      WEBHOOK_SECRET: ci_dummy_webhook_secret_16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: npm run db:migrate:test > migrate.log 2>&1 || (cat migrate.log && exit 1)
      - run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push
        run: |
          docker build -t ghcr.io/kelmordigital/api-04:dev-${{ github.sha }} .
          docker push ghcr.io/kelmordigital/api-04:dev-${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configurar SSH (chave restrita ao script de deploy)
        env:
          DEPLOY_KEY: ${{ secrets.K3S_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "2.29.128.26 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP4ARPtElRj3lyt7t3+izQFdX10SJkaweN1B/kSHJNhO" > ~/.ssh/known_hosts
      - name: Atualizar imagem no Deployment (dev)
        run: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@2.29.128.26 "api-04 dev dev-${{ github.sha }}"
