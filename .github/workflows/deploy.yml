name: Deploy API-04

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Atualizar codigo no servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.156.131.101
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: cd /Kelmor/API-04 && git fetch origin main && git clean -fd dist && git reset --hard origin/main

      - name: Copiar dist para o servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 178.156.131.101
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/"
          target: "/Kelmor/API-04/"

      - name: Build e deploy no servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.156.131.101
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: cd /Kelmor/API-04 && docker compose up -d --build --force-recreate

      - name: Notificar Discord - Sucesso
        if: success()
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "✅ Deploy concluído — API-04",
                "color": 3066993,
                "fields": [
                  {"name": "Commit", "value": "'"${{ github.event.head_commit.message }}"'", "inline": false},
                  {"name": "Autor", "value": "'"${{ github.actor }}"'", "inline": true},
                  {"name": "Branch", "value": "'"${{ github.ref_name }}"'", "inline": true}
                ],
                "footer": {"text": "Kelmor Deploy"}
              }]
            }'

      - name: Notificar Discord - Falha
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "❌ Deploy FALHOU — API-04",
                "color": 15158332,
                "fields": [
                  {"name": "Commit", "value": "'"${{ github.event.head_commit.message }}"'", "inline": false},
                  {"name": "Autor", "value": "'"${{ github.actor }}"'", "inline": true},
                  {"name": "Logs", "value": "[Ver aqui]('"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"')", "inline": true}
                ],
                "footer": {"text": "Kelmor Deploy"}
              }]
            }'
