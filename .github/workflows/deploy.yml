name: CI/CD API-04

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push
        run: |
          docker build -t ghcr.io/kelmordigital/api-04:${{ github.sha }} -t ghcr.io/kelmordigital/api-04:latest .
          docker push ghcr.io/kelmordigital/api-04:${{ github.sha }}
          docker push ghcr.io/kelmordigital/api-04:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configurar SSH (chave restrita ao script de deploy)
        env:
          DEPLOY_KEY: ${{ secrets.K3S_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "2.29.128.26 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP4ARPtElRj3lyt7t3+izQFdX10SJkaweN1B/kSHJNhO" > ~/.ssh/known_hosts
      - name: Atualizar imagem no Deployment (o script no servidor faz o rollout e volta atras se falhar)
        run: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@2.29.128.26 "api-04 prod ${{ github.sha }}"
 